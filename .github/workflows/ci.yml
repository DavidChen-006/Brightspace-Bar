name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-tests:
    # Package.swift asks for Swift tools 6.2, which ships with Xcode 26 — the
    # macos-26 image's default. macos-15 stops at Xcode 16 / Swift 6.1 and
    # fails at manifest load.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The Makefile's CLT framework/rpath flags are conditional on
      # /Library/Developer/CommandLineTools existing, so the same target
      # works both on a CLT-only machine and on Xcode runners.
      - name: Run Swift tests
        run: make -C BrightspaceBar test

  daemon-tests:
    name: daemon-tests (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end-of-life on 2026-04-30 and its test runner does
        # not expand the `tests/**/*.test.mjs` glob; package.json's engines
        # field says >=22 for the same reason.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # --ignore-scripts skips the postinstall (playwright install chromium):
      # the unit tests import the playwright package but never launch a browser.
      - name: Install daemon dependencies
        run: npm ci --ignore-scripts
        working-directory: session-capture
      - name: Run daemon tests
        run: npm test
        working-directory: session-capture
