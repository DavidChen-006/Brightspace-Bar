name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-tests:
    # Fall back to macos-14 if macos-15 runners are unavailable.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The Makefile's CLT framework/rpath flags are conditional on
      # /Library/Developer/CommandLineTools existing, so the same target
      # works both on a CLT-only machine and on Xcode runners.
      - name: Run Swift tests
        run: make -C BrightspaceBar test

  daemon-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # --ignore-scripts skips the postinstall (playwright install chromium):
      # the unit tests import the playwright package but never launch a browser.
      - name: Install daemon dependencies
        run: npm ci --ignore-scripts
        working-directory: session-capture
      - name: Run daemon tests
        run: npm test
        working-directory: session-capture
